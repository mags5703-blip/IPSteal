        * {

        /* 2 */
        body {
            background: #070b12;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;

        /* 3 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        /* 4 */
        .app {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.06) transparent;
            background: rgba(255, 255, 255, 0.015);
            backdrop-filter: blur(6px) saturate(1.1);
            -webkit-backdrop-filter: blur(6px) saturate(1.1);
            border-radius: 56px;
            padding: 32px 24px 28px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }
        /* 5 */
        .app::-webkit-scrollbar {
            width: 4px;
        }
        .app::-webkit-scrollbar-track {
            background: transparent;
        }
        .app::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
        }
        /* 6 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        /* 7 */
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

        .logo-icon {

            height: 44px;

            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);

    <script>
        // ==============================================================
        //  БЛОК 52: ФОТОНЫ (400+ строк)
        // ==============================================================
        (function() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const parts = [];
            const COUNT = 140;
            const DIST = 190;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Part {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.7;
                    this.vy = (Math.random() - 0.5) * 0.7;
                    this.r = 3 + Math.random() * 4;
                    this.a = 0.6 + Math.random() * 0.4;
                    this.hue = 200 + Math.floor(Math.random() * 40);
                    this.phase = Math.random() * Math.PI * 2;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > W) this.vx *= -1;
                    if (this.y < 0 || this.y > H) this.vy *= -1;
                    this.phase += 0.02;
                    this.a = 0.5 + Math.sin(this.phase) * 0.2 + 0.3;
                    this.r = 2.5 + Math.sin(this.phase * 0.5) * 1.5 + 2.5;
                }
                draw() {
                    // Яркое ядро
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    const alpha = Math.min(this.a, 0.95);
                    ctx.fillStyle = 'hsla(' + this.hue + ', 90%, 70%, ' + alpha + ')';
                    ctx.shadowColor = 'hsla(' + this.hue + ', 90%, 70%, 0.25)';
                    ctx.shadowBlur = 30;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // Внутренняя яркая точка
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 95%, 0.6)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) {
                parts.push(new Part());
            }

            function drawLines() {
                for (let i = 0; i < parts.length; i++) {
                    for (let j = i + 1; j < parts.length; j++) {
                        const dx = parts[i].x - parts[j].x;
                        const dy = parts[i].y - parts[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < DIST) {
                            const alpha = 1 - (dist / DIST);
                            const opacity = alpha * 0.2;
                            ctx.beginPath();
                            ctx.moveTo(parts[i].x, parts[i].y);
                            ctx.lineTo(parts[j].x, parts[j].y);
                            ctx.strokeStyle = 'hsla(210, 80%, 70%, ' + opacity + ')';
                            ctx.lineWidth = 0.5 + alpha * 0.5;
                            ctx.shadowColor = 'hsla(210, 80%, 70%, 0.02)';
                            ctx.shadowBlur = 6;
                            ctx.stroke();
                            ctx.shadowBlur = 0;
                        }
                    }
                }
            }

            function loop() {
                ctx.clearRect(0, 0, W, H);
                for (let i = 0; i < parts.length; i++) {
                    parts[i].update();
                    parts[i].draw();
                }
                drawLines();
                requestAnimationFrame(loop);
            }
            loop();
        })();

                        if (!progressWrap.style.display || progressWrap.style.display === 'none') {
                            const target = Math.max(15, Math.min(80, base));
                            graphBars[i].style.height = target + '%';
                        }
                    }
                }
            }, 600);
            window.addEventListener('beforeunload', function() {
                clearInterval(gi2);
            });
        })();
